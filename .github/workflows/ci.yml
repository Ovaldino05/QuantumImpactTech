name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  schema-caniuse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: packages/schema-caniuse
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: CLI smoke test
        run: |
          node bin/cli.js --list
          node bin/cli.js examples/mcp-tools.json --target gemini
      - name: Package contents
        run: npm pack --dry-run
